
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nviar Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Nviar Admin</div>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
        </header>

        <div id="alerts"></div>

        <div id="admin-login-view" class="card" style="max-width:400px; margin:60px auto;">
            <h3>Admin Access</h3>
            <input type="password" id="admin-pass" placeholder="Password" style="margin:15px 0;">
            <button class="btn btn-primary" id="btn-admin-login" onclick="verifyAdmin()">Login</button>
        </div>

        <div id="admin-panel" style="display:none;">
            <div class="card">
                <div class="admin-header">
                    <h2>Admin Dashboard</h2>
                    <button class="btn btn-primary" style="width:auto;" onclick="exitAdmin()">Log out</button>
                </div>
                <div class="admin-stats">
                    <div class="stat-card">
                        <div id="stat-total" class="stat-value">0</div>
                        <small>Posts</small>
                    </div>
                    <div class="stat-card">
                        <div id="stat-storage" class="stat-value">0 MB</div>
                        <small>Storage Used</small>
                    </div>
                    <div class="stat-card">
                        <div id="stat-expiry" class="stat-value">0</div>
                        <small>Expiring Soon</small>
                    </div>
                </div>
                <div id="admin-posts"></div>
            </div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
